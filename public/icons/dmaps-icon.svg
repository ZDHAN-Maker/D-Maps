<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="D'Maps - Offline Navigation OS">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dmapsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 3D Origami "D" Facet Gradients -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="topCurveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="outerLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="bottomCurveGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- GPS Pin Gradient -->
    <linearGradient id="pinBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="30%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="pinGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Neon Route Gradient -->
    <linearGradient id="neonRoute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.6" />
    </filter>
    <filter id="shadowPin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020617" flood-opacity="0.55" />
    </filter>
    <filter id="glowRoute" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#34D399" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect width="512" height="512" rx="120" fill="url(#dmapsBg)" />

  <!-- Subtle Contour Elevation Map Grid Lines -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="2.5" fill="none">
    <ellipse cx="256" cy="256" rx="220" ry="170" />
    <ellipse cx="256" cy="256" rx="170" ry="125" />
    <ellipse cx="256" cy="256" rx="120" ry="85" />
    <path d="M 0 170 Q 256 240 512 170" />
    <path d="M 0 340 Q 256 270 512 340" />
    <path d="M 170 0 Q 240 256 170 512" />
    <path d="M 340 0 Q 270 256 340 512" />
  </g>

  <!-- Big Stylized 3D Folded "D" Icon Base -->
  <g filter="url(#shadowD)">
    <!-- 1. Vertical Spine of "D" -->
    <path d="M 112 110 L 192 140 L 192 372 L 112 402 Z" fill="url(#spineGrad)" />
    <!-- Spine highlight line -->
    <path d="M 114 114 L 190 142" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- 2. Top Arch of "D" -->
    <path d="M 192 140 C 270 110, 360 130, 400 200 L 332 232 C 304 184, 240 174, 192 196 Z" fill="url(#topCurveGrad)" />

    <!-- 3. Outer Curved Right Loop of "D" -->
    <path d="M 400 200 C 430 250, 420 320, 370 368 L 308 316 C 340 280, 348 244, 332 232 Z" fill="url(#outerLoopGrad)" />

    <!-- 4. Bottom Arch of "D" returning to Spine -->
    <path d="M 370 368 C 320 410, 240 404, 192 372 L 192 316 C 228 336, 280 342, 308 316 Z" fill="url(#bottomCurveGrad)" />

    <!-- Road Grid markings inside the D folds -->
    <path d="M 112 256 L 192 256" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.4" />
    <path d="M 230 186 C 280 186, 330 216, 350 256" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.4" fill="none" />
    <path d="M 230 326 C 280 326, 320 310, 340 286" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.4" fill="none" />
  </g>

  <!-- Glowing Neon Navigation Route weaving through "D" -->
  <g filter="url(#glowRoute)">
    <path d="M 124 376 C 170 330, 160 220, 230 200 C 265 190, 275 220, 256 250"
          stroke="url(#neonRoute)" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Route Waypoint Pulse Dots -->
    <circle cx="124" cy="376" r="9" fill="#FFFFFF" />
    <circle cx="124" cy="376" r="5" fill="#10B981" />
  </g>

  <!-- Pin Cast Shadow on surface -->
  <ellipse cx="256" cy="326" rx="36" ry="14" fill="#020617" opacity="0.55" />

  <!-- Centerpiece: Floating Modern GPS Navigation Pin inside "D" -->
  <g filter="url(#shadowPin)">
    <!-- Pin Teardrop Shape -->
    <path d="M 256 120 C 198 120, 154 166, 154 224 C 154 286, 222 344, 256 392 C 290 344, 358 286, 358 224 C 358 166, 314 120, 256 120 Z"
          fill="url(#pinBodyGrad)" stroke="#FFFFFF" stroke-width="6" />

    <!-- Glassmorphic Inner Gleam -->
    <path d="M 256 128 C 205 128, 168 168, 168 220 C 168 234, 172 248, 178 260 C 192 196, 236 148, 256 142 C 276 148, 320 196, 334 260 C 340 248, 344 234, 344 220 C 344 168, 307 128, 256 128 Z"
          fill="url(#pinGleam)" />

    <!-- Pin Inner Disc -->
    <circle cx="256" cy="216" r="50" fill="#FFFFFF" />

    <!-- 4-Point Compass Navigation Needle (Gold & Blue) -->
    <!-- North Needle (Gold / Amber) -->
    <path d="M 256 178 L 268 216 L 256 208 Z" fill="#F59E0B" />
    <path d="M 256 178 L 244 216 L 256 208 Z" fill="#D97706" />
    <!-- South Needle (Blue) -->
    <path d="M 256 254 L 268 216 L 256 224 Z" fill="#2563EB" />
    <path d="M 256 254 L 244 216 L 256 224 Z" fill="#1D4ED8" />
    <!-- East Needle -->
    <path d="M 294 216 L 256 208 L 264 216 Z" fill="#3B82F6" />
    <path d="M 294 216 L 256 224 L 264 216 Z" fill="#1E40AF" />
    <!-- West Needle -->
    <path d="M 218 216 L 256 208 L 248 216 Z" fill="#60A5FA" />
    <path d="M 218 216 L 256 224 L 248 216 Z" fill="#3B82F6" />

    <!-- Center Pivot Dot -->
    <circle cx="256" cy="216" r="7" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
  </g>
</svg>
